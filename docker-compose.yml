services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: auth-modules-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-auth_modules}
      MYSQL_USER: ${MYSQL_USER:-auth_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-auth_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service (Elysia/Bun)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: auth-modules-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3000}
      # Database configuration (connection string format)
      DATABASE_URL: mysql://${MYSQL_USER:-auth_user}:${MYSQL_PASSWORD:-auth_password}@db:3306/${MYSQL_DATABASE:-auth_modules}
      # JWT configuration (RS256)
      JWT_ISSUER: ${JWT_ISSUER:-https://auth-modules.com}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      # CORS configuration
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - auth-network

  # Frontend Service (React/Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: auth-modules-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - auth-network

networks:
  auth-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
